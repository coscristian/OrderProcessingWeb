<div class="page">
  <div class="header">
    <div>
      <h2>Orders</h2>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Loading orders...</div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && orders.length === 0" class="empty">No orders found.</div>

  <div *ngIf="!loading && orders.length > 0" class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Date</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let order of orders">
          <td>#{{ order.id }}</td>

          <td>
            {{ order.createdAt | date: 'mediumDate' }}
          </td>

          <td>
            {{ formatMoney(order.total) }}
          </td>

          <td>
            <button class="btn" type="button" (click)="view(order.id)">View</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pager">
    <button class="btn" type="button" (click)="prev()" [disabled]="page <= 1 || loading">
      Previous
    </button>

    <span> Page {{ page }} of {{ totalPages }} </span>

    <button class="btn" type="button" (click)="next()" [disabled]="page >= totalPages || loading">
      Next
    </button>
  </div>
</div>
